name: WARDOGS Dev Feed Scraper

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push updated feeds
        run: |
          git config --global user.name "WARDOGS Scraper Bot"
          git config --global user.email "bot@wardogs.local"
          git add wardogs_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update WARDOGS dev feed [skip ci]" && git push)
